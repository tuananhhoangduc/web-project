$kind: http-request
name: 'Lấy đánh giá theo lịch hẹn'
method: GET
url: '{{base_url}}/api/reviews.php'
order: 15000
queryParams:
  - key: action
    value: 'get_by_appointment'
  - key: appointment_id
    value: '1'
tests: |-
  // Test 1: Status HTTP phải là 200
  pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
  });

  // Test 2: Response phải là JSON
  pm.test("Response is JSON", function () {
      pm.response.to.be.json;
  });

  // Test 3: status = 'success'
  pm.test("Response status is success", function () {
      const json = pm.response.json();
      pm.expect(json.status).to.eql('success');
  });

  // Test 4: Có trường 'data'
  pm.test("Response has 'data' field", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property('data');
  });

  // Test 5: Có trường 'has_review'
  pm.test("Response has 'has_review' field", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property('has_review');
      pm.expect(json.has_review).to.be.a('boolean');
  });

  // Test 6: Nếu has_review = true thì data có đủ trường
  pm.test("If has_review is true, data has required fields", function () {
      const json = pm.response.json();
      if (json.has_review === true && json.data) {
          pm.expect(json.data).to.have.property('review_id');
          pm.expect(json.data).to.have.property('rating');
          pm.expect(json.data).to.have.property('comment');
          pm.expect(json.data).to.have.property('created_at');
      }
  });
