$kind: http-request
name: 'Lấy tất cả đánh giá'
method: GET
url: '{{base_url}}/api/reviews.php'
order: 17000
queryParams:
  - key: action
    value: 'get_all'
  - key: page
    value: '1'
    disabled: true
tests: |-
  // Test 1: Status HTTP phải là 200
  pm.test("Status code is 200", function () {
      pm.response.to.have.status(200);
  });

  // Test 2: Response phải là JSON
  pm.test("Response is JSON", function () {
      pm.response.to.be.json;
  });

  // Test 3: status = 'success'
  pm.test("Response status is success", function () {
      const json = pm.response.json();
      pm.expect(json.status).to.eql('success');
  });

  // Test 4: data là mảng
  pm.test("Data is an array", function () {
      const json = pm.response.json();
      pm.expect(json.data).to.be.an('array');
  });

  // Test 5: Mỗi đánh giá có các trường cơ bản
  pm.test("Each review has required fields", function () {
      const json = pm.response.json();
      if (json.data.length > 0) {
          json.data.forEach(function(review) {
              pm.expect(review).to.have.property('review_id');
              pm.expect(review).to.have.property('rating');
              pm.expect(review).to.have.property('comment');
              pm.expect(review).to.have.property('created_at');
          });
      }
  });

  // Test 6: Có phân trang
  pm.test("Response has pagination fields", function () {
      const json = pm.response.json();
      pm.expect(json).to.have.property('total');
      pm.expect(json).to.have.property('current_page');
      pm.expect(json).to.have.property('total_pages');
  });
